<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ノリ打ち精算 Pro</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{ --bg:#f8fafc; --card:#ffffff; --line:#f1f5f9; --input-border:#e2e8f0; --text:#1e293b; --muted:#64748b; --green:#10b981; --red:#ef4444; --accent:#4f46e5; --line-green:#06c755; --gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{ margin:0; padding:20px 10px; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text); }
.wrap{max-width:800px; margin:auto;}
.card{ background:var(--card); border-radius:20px; padding:20px; margin-bottom:16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
h1{ font-size:22px; margin:0 0 15px; font-weight:800; }
h2{ font-size:18px; margin:0 0 16px; font-weight:700; }
.grid{ display:grid; grid-template-columns:repeat(12,1fr); gap:12px; }
.third{ grid-column:span 4; }
label{ display:block; margin-bottom:6px; font-weight:700; font-size:13px; }
input{ width:100%; padding:12px; border-radius:10px; border:1.5px solid var(--input-border); font-size:16px; color:var(--text); }
.player{ background:#fff; border:1px solid #f1f5f9; border-radius:16px; padding:20px; margin-bottom:12px; }
.player-top { display: flex; justify-content: space-between; margin-bottom: 12px; }
.result-label { font-size: 11px; font-weight: 700; margin-bottom: 4px; text-align:right; color:var(--muted);}
.result-value { font-size: 18px; font-weight: 800; color: #cbd5e1; text-align:right;}
.unused-display { font-size: 11px; color: var(--muted); margin-top: 4px; }
button{ border:none; border-radius:12px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; }
.main-btn{ background:var(--accent); color:white; width:100%; margin:10px 0 10px; }
.line-btn{ background:var(--line-green); color:white; width:100%; margin-bottom: 10px; }
.sub-btn{ background:#f1f5f9; color:var(--text); width:100%; }
.delete-btn{ background:#fee2e2; color:var(--red); width:100%; }

.grand-total-box { background: var(--gradient); border-radius: 20px; padding: 25px 20px; color: white; margin-bottom: 16px; }
.grand-total-label { font-size: 13px; opacity: 0.9; margin-bottom: 5px; }
.grand-total-value { font-size: 36px; font-weight: 900; }

.personal-total-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 24px; }
.personal-card { background: #f8fafc; border-radius: 12px; padding: 12px; border: 1px solid rgba(0,0,0,0.03); }
.personal-card .name-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.personal-card .amount-value { font-size: 16px; font-weight: 800; }

.summary{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.box{ padding:12px; border-radius:12px; background:#f8fafc; border:1px solid var(--line); }
.box-title{ font-size:11px; color:var(--muted); margin-bottom:2px;}
.box-value{ font-size:16px; font-weight:800; }
.table-wrapper{ overflow-x:auto; margin-top:15px; }
table{ width:100%; border-collapse:collapse; font-size:13px; min-width: 400px;}
th, td{ padding:12px 8px; border-bottom:1px solid var(--line); text-align:left; }
.pay-box{ margin-top:20px; border-radius:12px; background:#f0fdf4; padding:10px; }
.pay-row{ display:flex; justify-content:space-between; padding:8px; background:#fff; margin-bottom:5px; border-radius:8px; }

.hist-item { background:#fff; border-bottom: 1px solid var(--line); padding:15px 0; position:relative; }
.hist-item:last-child { border-bottom: none; }
.hist-del-btn { position:absolute; top:12px; right:0; color:var(--red); font-size:11px; font-weight:700; background:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>ノリ打ち精算</h1>
    <div class="grid">
      <div class="third"><label>基準投資</label><input id="baseInvest" type="number" value="40000" oninput="updateAllUnused()"></div>
      <div class="third"><label>交換率</label><input id="rate" type="number" value="20"></div>
      <div class="third"><label>換金単位</label><input id="roundUnit" type="number" value="500"></div>
    </div>
  </div>

  <div class="card">
    <h2>参加者</h2>
    <div id="players"></div>
    <div class="grid">
      <div style="grid-column: span 6;"><button class="sub-btn" id="addBtn">追加</button></div>
      <div style="grid-column: span 6;"><button class="sub-btn" id="saveMemberBtn">名前保存</button></div>
    </div>
  </div>

  <button class="main-btn" id="calcBtn">計算を実行して共有保存</button>
  <div id="loading" style="display:none; text-align:center; padding:10px; color:var(--accent); font-weight:bold;">データ処理中...</div>
  <button class="line-btn" id="lineSendBtn" style="display:none;">LINEに結果を送る</button>

  <div class="card" id="resultCard" style="display:none;">
    <h2>精算結果</h2>
    <div class="summary">
      <div class="box"><div class="box-title">グループ総損益</div><div class="box-value" id="profitTotal" style="color:var(--accent)">-</div></div>
      <div class="box"><div class="box-title">1人あたり純利益</div><div id="perProfit" class="box-value">-</div></div>
      <div class="box"><div class="box-title">回収</div><div id="cashTotal" class="box-value">-</div></div>
      <div class="box"><div class="box-title">未投資</div><div id="remainTotal" class="box-value">-</div></div>
    </div>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>名前</th><th>収支</th><th>手持ち</th><th>精算額</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pay-box" id="payBox">
      <div style="font-weight:800; color:#065f46; margin-bottom:10px;">お金の受け渡し指示</div>
      <div id="payList"></div>
    </div>
  </div>

  <div class="card">
    <h2>履歴と累計</h2>
    <div class="grand-total-box">
      <div class="grand-total-label">グループ全体の累計収支</div>
      <div class="grand-total-value" id="grandTotalDisplay">0円</div>
    </div>
    <div id="personalTotals" class="personal-total-grid"></div>
    <div id="history">読み込み中...</div>
  </div>
</div>

<script>
// LIFF ID と GAS URL を適宜書き換えてください
const LIFF_ID = "2010062599-fM2vPvTM"; 
const GAS_URL = "https://script.google.com/macros/s/AKfycbxKfYnLQu72GtdLcQKipGZXNGxtZkwaf3haW_LarpZctI3aK5qTcRoVr_bxCcRSvPOvQA/exec"; 

function money(v){ return (v >= 0 ? "+" : "") + new Intl.NumberFormat("ja-JP").format(Math.round(v)) + "円"; }

let historyData = [];
let lastShareMessage = "";

async function loadHistory() {
  const historyEl = document.getElementById("history");
  try {
    const res = await fetch(GAS_URL);
    historyData = await res.json();
    renderHistory();
  } catch (e) { 
    historyEl.innerHTML = "履歴を取得できません。";
  }
}

async function saveToDB(newData) {
  document.getElementById("loading").style.display = "block";
  try {
    await fetch(GAS_URL, { 
      method: "POST", 
      mode: "no-cors", 
      body: JSON.stringify(newData) 
    });
    // 保存後、少し待ってから履歴を再読み込み
    setTimeout(loadHistory, 1500);
  } catch (e) { console.error(e); }
}

async function deleteHistory(idx) {
  if(!confirm("この履歴を削除しますか？")) return;
  document.getElementById("loading").style.display = "block";
  await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ method: "DELETE", rowIdx: idx }) });
  setTimeout(loadHistory, 1500);
}

function renderHistory(){
  const el=document.getElementById("history");
  const personalEl=document.getElementById("personalTotals");
  const grandEl = document.getElementById("grandTotalDisplay");
  el.innerHTML=""; personalEl.innerHTML="";
  
  let pMap = {};
  let gTotal = 0;
  
  if(!Array.isArray(historyData) || historyData.length === 0){
    el.innerHTML = "履歴はありません。";
    grandEl.textContent = "0円";
    return;
  }

  [...historyData].reverse().forEach((h) => {
    gTotal += Number(h.profit || 0);
    let details="";
    h.players.forEach(p => {
      pMap[p.name] = (pMap[p.name] || 0) + Number(p.val);
      details += `<div style="display:flex; justify-content:space-between; font-size:12px;"><span>${p.name}</span><span style="color:${p.val>=0?'var(--green)':'var(--red)'}">${money(p.val)}</span></div>`;
    });

    const box = document.createElement("div");
    box.className = "hist-item";
    box.innerHTML = `<div class="hist-del-btn" onclick="deleteHistory(${h.id})">削除</div><div style="font-size:10px; color:var(--muted)">${h.time}</div><div style="font-weight:800; margin-bottom:5px;">合計 ${money(h.profit)}</div>${details}`;
    el.appendChild(box);
  });

  grandEl.textContent = money(gTotal);
  Object.keys(pMap).sort().forEach(name => {
    const pCard = document.createElement("div");
    pCard.className = "personal-card";
    pCard.innerHTML = `<div class="name-label">${name} 累計</div><div class="amount-value" style="color:${pMap[name]>=0?'var(--green)':'var(--red)'}">${money(pMap[name])}</div>`;
    personalEl.appendChild(pCard);
  });
  document.getElementById("loading").style.display = "none";
}

function updateAllUnused() {
  const base = +(document.getElementById("baseInvest").value || 0);
  document.querySelectorAll(".player").forEach(node => {
    const invest = +(node.querySelector(".invest").value || 0);
    node.querySelector(".unused-val").textContent = (base - invest) + "円";
  });
}

function addPlayer(name="", investValue=40000){
  const div=document.createElement("div");
  div.className="player";
  div.innerHTML=`<div class="player-top"><div style="width:60%;"><label>名前</label><input class="name" value="${name}"></div><div><div class="result-label">収支</div><div class="result-value">-</div></div></div><div class="grid"><div class="third"><label>投資</label><input class="invest" type="number" value="${investValue}" oninput="updateAllUnused()"><div class="unused-display">余り:<span class="unused-val">0円</span></div></div><div class="third"><label>枚数</label><input class="coins" type="number" value="0"></div><div class="third"><label style="color:transparent;">削</label><button class="delete-btn" onclick="this.closest('.player').remove()">×</button></div></div>`;
  document.getElementById("players").appendChild(div);
  updateAllUnused();
}

document.getElementById("calcBtn").onclick = async function() {
  const baseAmt = +(document.getElementById("baseInvest").value || 0);
  const rate = +(document.getElementById("rate").value || 0);
  const unit = +(document.getElementById("roundUnit").value || 1);
  const pNodes = document.querySelectorAll(".player");
  let players = [];
  
  pNodes.forEach(node => {
    const name = node.querySelector(".name").value || "匿名";
    const invest = +(node.querySelector(".invest").value || 0);
    const coins = +(node.querySelector(".coins").value || 0);
    const cash = Math.floor((coins * rate) / unit) * unit;
    players.push({ name, invest, coins, cash, node });
  });

  const totalInvest = players.reduce((s, p) => s + p.invest, 0);
  const totalCash = players.reduce((s, p) => s + p.cash, 0);
  const totalUnused = (baseAmt * players.length) - totalInvest;
  const totalProfit = totalCash - totalInvest;
  const perProfit = totalProfit / players.length;
  const fairShare = (totalCash + totalUnused) / players.length;

  document.getElementById("resultCard").style.display = "block";
  document.getElementById("lineSendBtn").style.display = "block";
  document.getElementById("profitTotal").textContent = money(totalProfit);
  document.getElementById("perProfit").textContent = money(perProfit);
  document.getElementById("cashTotal").textContent = money(totalCash);
  document.getElementById("remainTotal").textContent = money(totalUnused);
  
  const tbody = document.getElementById("tbody"); tbody.innerHTML = "";
  const payList = document.getElementById("payList"); payList.innerHTML = "";
  let receive = [], pay = [], snapshot = [];

  players.forEach(p => {
    const myProfit = p.cash - p.invest;
    const myHand = p.cash + (baseAmt - p.invest);
    const diff = fairShare - myHand;
    const resVal = p.node.querySelector(".result-value");
    resVal.textContent = money(myProfit);
    resVal.style.color = myProfit >= 0 ? "var(--green)" : "var(--red)";
    if(diff > 1) receive.push({ name: p.name, amount: diff });
    if(diff < -1) pay.push({ name: p.name, amount: -diff });
    
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><b>${p.name}</b></td><td style="color:${myProfit>=0?'var(--green)':'var(--red)'}">${money(myProfit)}</td><td>${money(myHand)}</td><td style="font-weight:800; color:${diff>=0?'var(--green)':'var(--red)'}">${diff >= 0 ? '貰う：' : '払う：'}${money(Math.abs(diff))}</td>`;
    tbody.appendChild(tr);
    snapshot.push({ name: p.name, val: myProfit });
  });

  // LINEメッセージ作成
  let msg = `【ノリ打ち精算レポート】\n\n■ 今回の収支\n`;
  snapshot.forEach(p => msg += `・${p.name}：${money(p.val)}\n`);
  msg += `合計：${money(totalProfit)}\n\n■ 受け渡し指示\n`;
  let hasPay = false;
  receive.forEach(r => {
    const rAmt = { ...r }; // 元データを壊さないようコピー
    pay.forEach(p => {
      const pAmt = { ...p };
      if(rAmt.amount <= 0 || pAmt.amount <= 0) return;
      const move = Math.min(rAmt.amount, pAmt.amount);
      payList.innerHTML += `<div class="pay-row"><span><b>${p.name}</b> → ${r.name}</span><span style="color:var(--green);font-weight:800;">${money(move)}</span></div>`;
      msg += `・${p.name} → ${r.name}：${money(move)}\n`;
      rAmt.amount -= move; pAmt.amount -= move; hasPay = true;
    });
  });
  if(!hasPay) msg += "移動なし\n";
  lastShareMessage = msg;

  // ★スプレッドシートへ保存を実行★
  await saveToDB({
    time: new Date().toLocaleString('ja-JP',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}), 
    profit: totalProfit, 
    players: snapshot 
  });
};

document.getElementById("lineSendBtn").onclick = async () => {
  liff.sendMessages([{ type: 'text', text: lastShareMessage }]).then(() => liff.closeWindow());
};

document.getElementById("addBtn").onclick = () => addPlayer();
document.getElementById("saveMemberBtn").onclick = () => {
  const names = [...document.querySelectorAll(".name")].map(i => i.value);
  localStorage.setItem("nori_members", JSON.stringify(names));
  alert("メンバー保存完了");
};

liff.init({ liffId: LIFF_ID }).then(() => {
  if (!liff.isLoggedIn()) { liff.login(); } else { loadHistory(); }
});

const savedMembers = JSON.parse(localStorage.getItem("nori_members") || '["Aさん","Bさん","Cさん"]');
savedMembers.forEach(n => addPlayer(n));
</script>
</body>
</html>
