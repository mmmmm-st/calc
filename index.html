<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ノリ打ち精算</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --line: #e2e8f0;
  --text: #0f172a;
  --muted: #64748b;
  --green: #059669;
  --red: #dc2626;
  --accent: #6366f1;
  --line-green: #06c755;
  --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  --radius: 20px;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px 12px; background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
}
.wrap { max-width: 680px; margin: auto; }
.card {
  background: var(--card); border-radius: var(--radius);
  padding: 24px; margin-bottom: 20px;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
  border: 1px solid var(--line);
}
h1 { font-size: 20px; margin: 0; font-weight: 800; }
h2 { font-size: 17px; margin: 0 0 16px; font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
.half { grid-column: span 6; }
label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 11px; color: var(--muted); text-transform: uppercase; }
input, select {
  width: 100%; padding: 12px; border-radius: 12px;
  border: 1.5px solid var(--line); font-size: 14px; background: #f8fafc; outline: none;
}
input:focus, select:focus { border-color: var(--accent); background: #fff; }
.player { background: #f8fafc; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.player-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
.result-label { font-size: 11px; font-weight: 600; color: var(--muted); text-align: right; }
.result-value { font-size: 17px; font-weight: 800; text-align: right; }
button { border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; }
.main-btn { background: var(--gradient); color: white; width: 100%; margin: 8px 0; }
.line-btn { background: var(--line-green); color: white; width: 100%; margin-bottom: 12px; }
.sub-btn { background: #f1f5f9; color: var(--text); width: 100%; border: 1px solid var(--line); }
.delete-btn { background: #fee2e2; color: var(--red); padding: 6px 12px; font-size: 12px; border-radius: 8px; }
.summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.box { padding: 14px; border-radius: 12px; background: #f8fafc; border: 1px solid var(--line); }
.box-title { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.box-value { font-size: 16px; font-weight: 800; }
.table-wrapper { overflow-x: auto; margin-top: 15px; border-radius: 12px; border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
th, td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: left; }
th { background: #f8fafc; color: var(--muted); font-size: 11px; }
.pay-box { margin-top: 16px; border-radius: 12px; background: #f0fdf4; border: 1px solid #bbf7d0; padding: 14px; }
.pay-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #fff; margin-bottom: 6px; border-radius: 8px; border: 1px solid #dcfce7; font-size: 14px; }
.hist-item { background: #f8fafc; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; position: relative; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🎰 ノリ打ち精算</h1>
  </div>

  <div class="card">
    <h2>参加者</h2>
    <div id="players"></div>
    <button class="sub-btn" id="addBtn" style="border-style: dashed; color: var(--accent);">＋ 参加者を追加</button>
  </div>

  <button class="main-btn" id="calcBtn">計算を実行してプレビュー</button>
  <div id="loading" style="display:none; text-align:center; padding:10px; color:var(--accent); font-weight:bold;">処理中...</div>
  <button class="line-btn" id="lineSendBtn" style="display:none;">LINEに結果を送る</button>

  <div class="card" id="resultCard" style="display:none;">
    <h2>精算結果</h2>
    <div class="summary">
      <div class="box"><div class="box-title">グループ総損益</div><div class="box-value" id="profitTotal">-</div></div>
      <div class="box"><div class="box-title">1人あたり純利益</div><div id="perProfit" class="box-value">-</div></div>
      <div class="box"><div class="box-title">総投資額</div><div id="investTotal" class="box-value">-</div></div>
      <div class="box"><div class="box-title">総回収額</div><div id="cashTotal" class="box-value">-</div></div>
    </div>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>名前</th><th>投資</th><th>回収</th><th>収支</th><th>精算額</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pay-box">
      <div style="font-weight: 700; color: #166534; font-size: 13px; margin-bottom: 8px;">💸 お金の受け渡し指示</div>
      <div id="payList"></div>
    </div>
  </div>

  <div class="card">
    <h2>履歴一覧</h2>
    <div id="history" style="color: var(--muted); font-size: 13px;">読み込み中...</div>
  </div>
</div>

<script>
const LIFF_ID = "2010062599-fM2vPvTM"; 
const GAS_URL = "https://script.google.com/macros/s/AKfycbzC7M8Jv0XHX3rekb5z6j-v9YJq0frhsqzcy65_Ush3ebYpCNKHDuNoYb_pkLZz4JTrQ/exec"; 

function money(v){
  if (v === 0) return "0円";
  return (v > 0 ? "+" : "") + new Intl.NumberFormat("ja-JP").format(Math.round(v)) + "円";
}

let historyData = [];
let lastShareMessage = "";
let storedMembers = ["Aさん", "Bさん", "Cさん"];

async function loadHistory() {
  try {
    const res = await fetch(GAS_URL);
    historyData = await res.json();
    renderHistory();
  } catch (e) {
    document.getElementById("history").innerHTML = "履歴の読み込みに失敗しました。";
  }
}

async function deleteHistory(rowIdx) {
  if(!confirm("この履歴を削除しますか？")) return;
  document.getElementById("loading").style.display = "block";
  try {
    await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ method: "DELETE", rowIdx: rowIdx }) });
  } catch(e) {}
  setTimeout(async () => {
    await loadHistory();
    document.getElementById("loading").style.display = "none";
  }, 1000);
}

function renderHistory() {
  const el = document.getElementById("history");
  el.innerHTML = "";
  if(!Array.isArray(historyData) || historyData.length === 0) {
    el.innerHTML = "履歴はありません。";
    return;
  }

  [...historyData].reverse().forEach((h) => {
    let details = "";
    if(h.players) {
      h.players.forEach(p => {
        details += `<div style="display:flex; justify-content:space-between; font-size:12px; margin-top:4px;"><span>${p.name}</span><span style="font-weight:600; color:${p.val>=0?'var(--green)':'var(--red)'}">${money(p.val)}</span></div>`;
      });
    }

    const box = document.createElement("div");
    box.className = "hist-item";
    box.innerHTML = `
      <div style="position:absolute; top:14px; right:14px;">
        <button class="delete-btn" onclick="deleteHistory(${h.rowIdx})">削除</button>
      </div>
      <div style="font-size:11px; color:var(--muted); font-weight:600; margin-bottom:4px;">${h.time}</div>
      <div style="font-weight:800; margin-bottom:8px; font-size:14px;">合計 ${money(h.profit)}</div>
      ${details}
    `;
    el.appendChild(box);
  });
}

function addPlayer(name = "", invest = 10000, cash = 0){
  const div = document.createElement("div");
  div.className = "player";
  let options = '<option value="">選択してください</option>';
  storedMembers.forEach(m => {
    options += `<option value="${m}" ${m === name ? 'selected' : ''}>${m}</option>`;
  });

  div.innerHTML = `
    <div class="player-top">
      <div style="width:60%;">
        <label>名前</label>
        <select class="name-select">${options}</select>
      </div>
      <div>
        <div class="result-label">個人の収支</div>
        <div class="result-value">-</div>
      </div>
    </div>
    <div class="grid">
      <div class="half"><label>投資額</label><input class="invest" type="number" value="${invest}"></div>
      <div class="half"><label>回収額</label><input class="cash" type="number" value="${cash}"></div>
    </div>
    <div style="margin-top:12px; display:flex; justify-content:flex-end;">
      <button class="delete-btn" onclick="this.closest('.player').remove()">削除</button>
    </div>`;
  document.getElementById("players").appendChild(div);
}

document.getElementById("calcBtn").onclick = async function() {
  const pNodes = document.querySelectorAll(".player");
  if(pNodes.length === 0) { alert("参加者を追加してください"); return; }

  let players = [], hasError = false;
  pNodes.forEach(node => {
    const name = node.querySelector(".name-select").value;
    const invest = +(node.querySelector(".invest").value || 0);
    const cash = +(node.querySelector(".cash").value || 0);
    if(!name) hasError = true;
    players.push({ name, invest, cash, node });
  });

  if(hasError) { alert("名前が未選択の参加者がいます"); return; }

  const totalInvest = players.reduce((s, p) => s + p.invest, 0);
  const totalCash = players.reduce((s, p) => s + p.cash, 0);
  const totalProfit = totalCash - totalInvest;
  const fairProfitPerPerson = totalProfit / players.length;

  document.getElementById("resultCard").style.display = "block";
  document.getElementById("lineSendBtn").style.display = "block";
  document.getElementById("profitTotal").textContent = money(totalProfit);
  document.getElementById("perProfit").textContent = money(fairProfitPerPerson);
  document.getElementById("investTotal").textContent = totalInvest.toLocaleString() + "円";
  document.getElementById("cashTotal").textContent = totalCash.toLocaleString() + "円";

  const tbody = document.getElementById("tbody"); tbody.innerHTML = "";
  const payList = document.getElementById("payList"); payList.innerHTML = "";
  let receive = [], pay = [], snapshot = [];

  players.forEach(p => {
    const individualProfit = p.cash - p.invest;
    const targetAmount = p.invest + fairProfitPerPerson;
    const diff = p.cash - targetAmount;

    p.node.querySelector(".result-value").textContent = money(individualProfit);
    p.node.querySelector(".result-value").style.color = individualProfit >= 0 ? "var(--green)" : "var(--red)";

    if(diff > 1) pay.push({ name: p.name, amount: diff });
    else if(diff < -1) receive.push({ name: p.name, amount: -diff });

    const isPay = diff > 0;
    tbody.innerHTML += `<tr><td><b>${p.name}</b></td><td>${p.invest.toLocaleString()}円</td><td>${p.cash.toLocaleString()}円</td><td style="color:${individualProfit>=0?'var(--green':'var(--red')};">${money(individualProfit)}</td><td style="font-weight:800; color:${isPay?'var(--red)':'var(--green)'}">${isPay ? '払う：' : '貰う：'}${Math.round(Math.abs(diff)).toLocaleString()}円</td></tr>`;
    snapshot.push({ name: p.name, val: individualProfit });
  });

  let msg = `【ノリ打ち精算レポート】\n\n■ 今回の収支\n`;
  snapshot.forEach(p => msg += `・${p.name}：${money(p.val)}\n`);
  msg += `合計：${money(totalProfit)}\n\n■ 受け渡し指示\n`;
  let hasPay = false;

  pay.forEach(p => {
    receive.forEach(r => {
      if(p.amount <= 0 || r.amount <= 0) return;
      const move = Math.min(p.amount, r.amount);
      payList.innerHTML += `<div class="pay-row"><span><b>${p.name}</b> → ${r.name}</span><span style="color:var(--green);font-weight:800;">${Math.round(move).toLocaleString()}円</span></div>`;
      msg += `・${p.name} → ${r.name}：${Math.round(move).toLocaleString()}円\n`;
      p.amount -= move; r.amount -= move; hasPay = true;
    });
  });

  if(!hasPay) {
    payList.innerHTML = `<div style="color:var(--muted); font-size:13px;">受け渡しの必要はありません</div>`;
    msg += "移動なし\n";
  }
  lastShareMessage = msg;

  const now = new Date();
  const timeStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;

  document.getElementById("loading").style.display = "block";
  try {
    await fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify({ time: timeStr, profit: totalProfit, players: snapshot })
    });
  } catch(e) {}

  setTimeout(async () => {
    await loadHistory();
    document.getElementById("loading").style.display = "none";
  }, 1000);
};

document.getElementById("lineSendBtn").onclick = () => {
  liff.sendMessages([{ type: 'text', text: lastShareMessage }]).then(() => liff.closeWindow());
};

document.getElementById("addBtn").onclick = () => addPlayer();

liff.init({ liffId: LIFF_ID }).then(() => {
  if (!liff.isLoggedIn()) { liff.login(); } 
  else { 
    loadHistory();
    addPlayer("Aさん", 10000, 0);
    addPlayer("Bさん", 10000, 0);
  }
});
</script>
</body>
</html>
