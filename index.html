<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ノリ打ち精算</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --line: #e2e8f0;
  --text: #0f172a;
  --muted: #64748b;
  --green: #059669;
  --red: #dc2626;
  --accent: #6366f1;
  --accent-light: #e0e7ff;
  --line-green: #06c755;
  --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  --shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.08), 0 8px 10px -6px rgba(99, 102, 241, 0.08);
  --radius: 20px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  padding: 16px 8px;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 680px; margin: auto; width: 100%; overflow-x: hidden; }

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(226, 232, 240, 0.8);
  width: 100%;
}

@media (min-width: 480px) {
  .card { padding: 24px; }
  body { padding: 24px 12px; }
}

h1 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: -0.025em; color: var(--text); }
h2 { font-size: 16px; margin: 0 0 16px; font-weight: 700; letter-spacing: -0.025em; display: flex; align-items: center; gap: 8px; }

.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; width: 100%; }
.half { grid-column: span 6; }

label {
  display: block;
  margin-bottom: 6px;
  font-weight: 600;
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

input, select {
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  font-size: 16px;
  color: var(--text);
  background: #f8fafc;
  transition: all 0.2s ease;
  outline: none;
  font-weight: 500;
}

input[type="date"] {
  appearance: none;
  -webkit-appearance: none;
  background-color: #f8fafc;
  text-align: center;
}

input:focus, select:focus {
  background: #fff;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
}

.player {
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 12px;
  width: 100%;
}

.player-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 10px;
  gap: 8px;
}

.result-label { font-size: 11px; font-weight: 600; margin-bottom: 2px; text-align: right; color: var(--muted); }
.result-value { font-size: 16px; font-weight: 800; text-align: right; }

button {
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s ease, background 0.2s;
  width: 100%;
}
button:active { transform: scale(0.98); }

.main-btn { background: var(--gradient); color: white; margin: 8px 0; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35); }
.line-btn { background: var(--line-green); color: white; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(6, 199, 85, 0.35); }
.sub-btn { background: #f1f5f9; color: var(--text); border: 1px solid var(--line); }
.sub-btn:hover { background: #e2e8f0; }

.delete-btn { background: #fee2e2; color: var(--red); width: auto; padding: 6px 12px; font-size: 11px; border-radius: 6px; }

.grand-total-box {
  background: var(--gradient);
  border-radius: 16px;
  padding: 16px;
  color: white;
  margin-bottom: 20px;
  box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.4);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
@media (min-width: 480px) {
  .grand-total-box {
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
  }
}
.grand-total-label { font-size: 11px; opacity: 0.85; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.grand-total-value { font-size: 24px; font-weight: 900; letter-spacing: -0.03em; }
.grand-winrate-badge {
  background: rgba(255, 255, 255, 0.2);
  padding: 8px 14px;
  border-radius: 12px;
  text-align: left;
  backdrop-filter: blur(4px);
}
@media (min-width: 480px) {
  .grand-winrate-badge { text-align: right; }
}
.grand-winrate-label { font-size: 10px; opacity: 0.85; font-weight: 600; text-transform: uppercase; }
.grand-winrate-value { font-size: 16px; font-weight: 800; }

.global-filter-card {
  background: #f1f5f9;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 20px;
}
.filter-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}
@media (min-width: 480px) {
  .filter-grid {
    grid-template-columns: 1.2fr 1fr 1fr;
  }
}
.filter-grid select {
  background: #fff;
  font-size: 13px;
  padding: 10px 12px;
  font-weight: 600;
}

.chart-card {
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
  overflow: hidden;
}
.chart-title { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }

.chart-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }

/* グラフをゆったり大きく見せるコンテナ */
.chart-fit-wrap {
  width: 100%;
  background: #fff;
  border-radius: 12px;
  border: 1px solid var(--line);
  padding: 8px 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
svg { 
  display: block; 
  height: 270px; /* 高さをしっかり大きくしました */
}

.personal-total-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
.personal-card { background: #f8fafc; border-radius: 14px; padding: 12px; border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; }
.personal-card .name-label { font-size: 13px; color: var(--text); font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.personal-card .amount-value { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
.personal-card .sub-info { font-size: 11px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 8px; }

.mest-row { 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  border-top: 1px solid var(--line); 
  padding-top: 8px; 
  margin-top: 4px; 
  font-size: 12px; 
  font-weight: 700; 
  gap: 4px;
}
.mest-text { white-space: nowrap; }
.mest-btn { 
  padding: 4px 8px; 
  font-size: 11px; 
  background: #fee2e2; 
  color: var(--red); 
  border-radius: 6px; 
  font-weight: 700; 
  width: auto !important; 
}
.mest-btn:disabled {
  background: #f1f5f9;
  color: #cbd5e1;
  cursor: not-allowed;
}

.summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
.box { padding: 12px; border-radius: 12px; background: #f8fafc; border: 1px solid var(--line); }
.box-title { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.box-value { font-size: 15px; font-weight: 800; }

.table-wrapper { overflow-x: auto; margin-top: 15px; border-radius: 12px; border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 380px; background: #fff; }
th { background: #f8fafc; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
tr:last-child td { border-bottom: none; }

.pay-box { margin-top: 16px; border-radius: 12px; background: #f0fdf4; border: 1px solid #bbf7d0; padding: 12px; }
.pay-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #fff; margin-bottom: 6px; border-radius: 8px; border: 1px solid #dcfce7; font-size: 13px; }

.hist-item { background: #f8fafc; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; position: relative; }
.hist-actions { position: absolute; top: 14px; right: 14px; display: flex; gap: 6px; align-items: center; }

.accordion-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.accordion-icon {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  transition: transform 0.2s;
}
#historyContainer {
  display: none;
  margin-top: 16px;
}

.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 1000; }
.modal-content { background: #fff; padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;">
    <h1>🎰 ノリ打ち精算</h1>
    <button class="sub-btn" id="openMemberModal" style="width: auto; padding: 8px 12px; font-size: 12px; background: var(--accent-light); color: var(--accent); border: none; font-weight: 700;">メンバー管理</button>
  </div>

  <div class="card">
    <h2>参加者 & 日付</h2>
    <div style="margin-bottom: 16px;">
      <label>実践日</label>
      <input type="date" id="recordDateInput">
    </div>
    <div id="players"></div>
    <button class="sub-btn" id="addBtn" style="border-style: dashed; border-color: #cbd5e1; color: var(--accent); font-weight: 600;">＋ 参加者を追加</button>
  </div>

  <button class="main-btn" id="calcBtn">計算を実行して保存</button>
  <div id="loading" style="display:none; text-align:center; padding:10px; color:var(--accent); font-weight:bold;">処理中...</div>
  <button class="line-btn" id="lineSendBtn" style="display:none;">LINEに結果を送る</button>

  <div class="card" id="resultCard" style="display:none;">
    <h2>精算結果</h2>
    <div class="summary">
      <div class="box"><div class="box-title">グループ総損益</div><div class="box-value" id="profitTotal" style="color:var(--accent)">-</div></div>
      <div class="box"><div class="box-title">1人あたり純利益</div><div id="perProfit" class="box-value">-</div></div>
      <div class="box"><div class="box-title">総投資額</div><div id="investTotal" class="box-value">-</div></div>
      <div class="box"><div class="box-title">総回収額</div><div id="cashTotal" class="box-value">-</div></div>
    </div>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>名前</th><th>投資</th><th>回収</th><th>収支</th><th>精算額</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pay-box" id="payBox">
      <div style="font-weight: 700; color: #166534; font-size: 13px; margin-bottom: 8px;">💸 お金の受け渡し指示</div>
      <div id="payList"></div>
    </div>
  </div>

  <div class="global-filter-card">
    <div style="font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">🔍 表示フィルター</div>
    <div class="filter-grid">
      <select id="combinationSelect" onchange="onFilterChange()"></select>
      <select id="yearSelect" onchange="onYearChange()"></select>
      <select id="monthSelect" onchange="onFilterChange()"></select>
    </div>
  </div>

  <div class="card">
    <h2>統計グラフ</h2>
    <div class="grand-total-box">
      <div>
        <div class="grand-total-label" id="grandTotalLabel">グループ選択期間の累計収支</div>
        <div class="grand-total-value" id="grandTotalDisplay">0円</div>
      </div>
      <div class="grand-winrate-badge">
        <div class="grand-winrate-label">グループ勝率</div>
        <div class="grand-winrate-value" id="grandWinRateDisplay">0%</div>
      </div>
    </div>

    <div class="chart-card" id="graphsArea" style="display:none;">
      <div class="chart-title">📈 収支推移グラフ</div>
      <div class="chart-legend" id="chartLegend"></div>
      <div class="chart-fit-wrap">
        <svg id="excelLineChart"></svg>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>個人別実績・飯スト</h2>
    <div id="personalTotals" class="personal-total-grid"></div>
    <div style="font-size: 11px; color: var(--muted); margin-bottom: 0px;">※選択中の組み合わせ・期間に参加しているメンバーのみ表示されます。</div>
  </div>

  <div class="card">
    <div class="accordion-header" onclick="toggleHistoryAccordion()">
      <h2 style="margin:0;">履歴一覧</h2>
      <span class="accordion-icon" id="accordionIcon">▼ 表示する</span>
    </div>
    <div id="historyContainer">
      <div id="history" style="color: var(--muted); font-size: 13px;">読み込み中...</div>
    </div>
  </div>
</div>

<div class="modal" id="memberModal">
  <div class="modal-content">
    <h2>メンバー管理</h2>
    <p style="font-size: 12px; color: var(--muted); margin-bottom: 16px;">よく参加するメンバーの名前を登録できます。</p>
    <div id="memberListEdit" style="margin-bottom: 16px; max-height: 200px; overflow-y: auto;"></div>
    <div class="grid" style="margin-bottom: 12px;">
      <div class="half"><input type="text" id="newMemberName" placeholder="新しい名前"></div>
      <div class="half"><button class="sub-btn" id="addMemberStoreBtn" style="background: var(--accent); color: #fff; border:none; height: 100%;">追加</button></div>
    </div>
    <button class="sub-btn" id="closeModalBtn" style="background: #f1f5f9;">閉じる</button>
  </div>
</div>

<script>
const LIFF_ID = "2010062599-fM2vPvTM"; 
const GAS_URL = "https://script.google.com/macros/s/AKfycby7oUyS6AHE-B5b_v1xtSuIFEIOsS0s_1kN6JeskN7tm1wp3cxkBHBrNvTs-6TQMrxG8g/exec"; 
  
function money(v){
  if (v === 0) return "0円";
  return (v > 0 ? "+" : "") + new Intl.NumberFormat("ja-JP").format(Math.round(v)) + "円";
}

let historyData = [];
let serverMestMap = {};
let lastShareMessage = "";
let storedMembers = JSON.parse(localStorage.getItem("nori_stored_members") || '["Aさん", "Bさん", "Cさん"]');

function cleanTimeStr(rawTime) {
  if (!rawTime) return "";
  let str = String(rawTime);
  if (str.includes("T") || str.includes("-")) {
    let d = new Date(str);
    if (!isNaN(d.getTime())) {
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    }
  }
  return str;
}

function parseDateStrToObj(dateStr) {
  if (!dateStr) return new Date(0);
  let match = dateStr.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
  if (match) {
    return new Date(match[1], match[2] - 1, match[3]);
  }
  let d = new Date(dateStr);
  return isNaN(d.getTime()) ? new Date(0) : d;
}

function toggleHistoryAccordion() {
  const container = document.getElementById("historyContainer");
  const icon = document.getElementById("accordionIcon");
  if (container.style.display === "block") {
    container.style.display = "none";
    icon.textContent = "▼ 表示する";
  } else {
    container.style.display = "block";
    icon.textContent = "▲ 閉じる";
  }
}

async function loadHistory() {
  const historyEl = document.getElementById("history");
  try {
    const res = await fetch(GAS_URL);
    let jsonRes = await res.json();
    
    historyData = (jsonRes.history || []).map(item => ({ ...item, time: cleanTimeStr(item.time) }));
    serverMestMap = jsonRes.mestMap || {};
    
    historyData.sort((a, b) => parseDateStrToObj(a.time) - parseDateStrToObj(b.time));
    
    renderAll();
  } catch (e) { 
    historyEl.innerHTML = "履歴の読み込みに失敗しました。";
    historyData = [];
    serverMestMap = {};
    renderAll();
  }
}

window.updateMemberMest = async function(name, delta) {
  let currentCount = serverMestMap[name] || 0;
  if(delta < 0 && currentCount <= 0) {
    alert("消費できる飯ストがありません。");
    return;
  }
  
  if(!confirm(`「${name}」の飯ストを1つ消費しますか？`)) return;

  document.getElementById("loading").style.display = "block";
  try {
    await fetch(GAS_URL, { 
      method: "POST", 
      mode: "no-cors", 
      body: JSON.stringify({ method: "UPDATE_MEST", name: name, delta: delta }) 
    });
    await loadHistory();
  } catch(e) {
    console.error(e);
  }
  document.getElementById("loading").style.display = "none";
};

async function deleteHistory(rowIdx) {
  if(!confirm("この履歴を削除しますか？")) return;
  
  document.getElementById("loading").style.display = "block";
  try {
    await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ method: "DELETE", rowIdx: rowIdx }) });
  } catch(e) {
    console.error(e);
  }
  await loadHistory();
  document.getElementById("loading").style.display = "none";
}

function renderAll() {
  const graphsArea = document.getElementById("graphsArea");
  if(!Array.isArray(historyData) || historyData.length === 0){
    graphsArea.style.display = "none";
    document.getElementById("history").innerHTML = "履歴はありません。";
    document.getElementById("personalTotals").innerHTML = "";
    document.getElementById("grandTotalDisplay").textContent = "0円";
    document.getElementById("grandWinRateDisplay").textContent = "0%";
    return;
  }
  graphsArea.style.display = "block";
  updateFilterSelectOptions();
  renderFilteredContent();
}

function renderFilteredContent() {
  renderGrandTotals();
  renderExcelChart();
  renderPersonalTotalsAndHistory();
}

function renderPersonalTotalsAndHistory() {
  const personalEl = document.getElementById("personalTotals");
  const histEl = document.getElementById("history");
  const comboSelect = document.getElementById("combinationSelect");
  const yearSelect = document.getElementById("yearSelect");
  const monthSelect = document.getElementById("monthSelect");

  personalEl.innerHTML = "";
  histEl.innerHTML = "";

  const selectedCombo = comboSelect ? comboSelect.value : "";
  const selectedYear = yearSelect ? yearSelect.value : "all";
  const selectedMonth = monthSelect ? monthSelect.value : "all";

  let filteredHistory = historyData.filter(h => {
    const names = h.players.map(p => p.name).sort().join(", ");
    if(selectedCombo && names !== selectedCombo) return false;
    return matchFilter(h, selectedYear, selectedMonth);
  });

  if(filteredHistory.length === 0) {
    personalEl.innerHTML = "<div style='font-size:12px; color:var(--muted); grid-column: 1/-1;'>該当するメンバー・期間の実績はありません。</div>";
    histEl.innerHTML = "該当する期間の履歴はありません。";
    return;
  }

  let pStats = {};
  filteredHistory.forEach((h) => {
    h.players.forEach(p => {
      if(!pStats[p.name]) {
        pStats[p.name] = { total: 0, count: 0, wins: 0 };
      }
      pStats[p.name].total += Number(p.val);
      pStats[p.name].count += 1;
      if(Number(p.val) >= 0) {
        pStats[p.name].wins += 1;
      }
    });
  });

  Object.keys(pStats).sort().forEach(name => {
    const s = pStats[name];
    const winRate = s.count > 0 ? Math.round((s.wins / s.count) * 100) : 0;
    let mestCount = serverMestMap[name] || 0;
    const canConsume = mestCount > 0;

    const pCard = document.createElement("div");
    pCard.className = "personal-card";
    pCard.innerHTML = `
      <div>
        <div class="name-label">${name}</div>
        <div class="amount-value" style="color:${s.total>=0?'var(--green)':'var(--red)'}">${money(s.total)}</div>
        <div class="sub-info">
          <span>勝率: ${winRate}%</span>
          <span>(${s.wins}勝/${s.count}回)</span>
        </div>
      </div>
      <div class="mest-row">
        <span class="mest-text">飯スト: <b style="color:var(--accent);">${mestCount}</b></span>
        <button class="mest-btn" ${!canConsume ? 'disabled style="background:#f1f5f9;color:#cbd5e1;cursor:not-allowed;"' : ''} onclick="updateMemberMest('${name}', -1)">消費</button>
      </div>
    `;
    personalEl.appendChild(pCard);
  });

  [...filteredHistory].reverse().forEach((h) => {
    let details = "";
    h.players.forEach(p => {
      details += `<div style="display:flex; justify-content:space-between; font-size:12px; margin-top:4px;"><span>${p.name}</span><span style="font-weight:600; color:${p.val>=0?'var(--green)':'var(--red)'}">${money(p.val)}</span></div>`;
    });

    const box = document.createElement("div");
    box.className = "hist-item";
    box.innerHTML = `
      <div class="hist-actions">
        <button class="delete-btn" onclick="deleteHistory(${h.rowIdx})">削除</button>
      </div>
      <div style="font-size:11px; color:var(--muted); font-weight:600; margin-bottom:4px;">記録日時</div>
      <div style="font-weight:700; font-size:13px; color:var(--text); margin-bottom:6px;">${h.time}</div>
      <div style="font-weight:800; margin-bottom:8px; font-size:14px;">合計 ${money(h.profit)}</div>
      ${details}
    `;
    histEl.appendChild(box);
  });
}

function renderGrandTotals() {
  const grandEl = document.getElementById("grandTotalDisplay");
  const grandWinRateEl = document.getElementById("grandWinRateDisplay");
  const grandLabelEl = document.getElementById("grandTotalLabel");
  const comboSelect = document.getElementById("combinationSelect");
  const yearSelect = document.getElementById("yearSelect");
  const monthSelect = document.getElementById("monthSelect");

  const selectedCombo = comboSelect ? comboSelect.value : "";
  const selectedYear = yearSelect ? yearSelect.value : "all";
  const selectedMonth = monthSelect ? monthSelect.value : "all";

  let labelStr = "グループ累計収支";
  if(selectedYear !== "all") {
    labelStr = selectedMonth !== "all" ? `${selectedYear}年${selectedMonth}月のグループ収支` : `${selectedYear}年のグループ累計収支`;
  }
  grandLabelEl.textContent = labelStr;

  let gTotal = 0;
  let totalSessions = 0;
  let winSessions = 0;

  if(Array.isArray(historyData)) {
    historyData.forEach(h => {
      const names = h.players.map(p => p.name).sort().join(", ");
      if(selectedCombo && names !== selectedCombo) return;
      if(matchFilter(h, selectedYear, selectedMonth)) {
        const profit = Number(h.profit || 0);
        gTotal += profit;
        totalSessions += 1;
        if(profit >= 0) {
          winSessions += 1;
        }
      }
    });
  }

  const groupWinRate = totalSessions > 0 ? Math.round((winSessions / totalSessions) * 100) : 0;
  grandEl.textContent = money(gTotal);
  grandWinRateEl.textContent = `${groupWinRate}% (${winSessions}/${totalSessions}勝)`;
}

function getAvailableYearsAndMonths() {
  let yearsSet = new Set();
  let yearMonthMap = {};

  historyData.forEach(h => {
    if(!h.time) return;
    let timeStr = String(h.time);
    let yMatch = timeStr.match(/(\d{4})年/);
    let year = yMatch ? yMatch[1] : "2026";
    yearsSet.add(year);

    if(!yearMonthMap[year]) yearMonthMap[year] = new Set();
    let mMatch = timeStr.match(/(\d{1,2})月/);
    if(mMatch) {
      yearMonthMap[year].add(mMatch[1]);
    }
  });

  let years = Array.from(yearsSet).sort().reverse();
  let formattedMap = {};
  Object.keys(yearMonthMap).forEach(y => {
    formattedMap[y] = Array.from(yearMonthMap[y]).sort((a,b)=>Number(b)-Number(a));
  });

  return { years, yearMonthMap: formattedMap };
}

function updateFilterSelectOptions() {
  const comboSelect = document.getElementById("combinationSelect");
  const yearSelect = document.getElementById("yearSelect");
  const currentCombo = comboSelect.value;
  const currentYear = yearSelect.value || "all";

  let combos = {}; 
  historyData.forEach(h => {
    const names = h.players.map(p => p.name).sort().join(", ");
    if(names) {
      combos[names] = `👥 ${names} (${h.players.length}人)`;
    }
  });

  const comboKeys = Object.keys(combos);
  comboSelect.innerHTML = "";
  comboKeys.forEach((key, index) => {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = combos[key];
    if(key === currentCombo || (!currentCombo && index === 0)) opt.selected = true;
    comboSelect.appendChild(opt);
  });

  let { years } = getAvailableYearsAndMonths();
  yearSelect.innerHTML = `<option value="all">📅 全期間</option>`;
  years.forEach(y => {
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = `📁 ${y}年`;
    yearSelect.appendChild(opt);
  });
  if([...yearSelect.options].some(o => o.value === currentYear)) {
    yearSelect.value = currentYear;
  } else {
    yearSelect.value = "all";
  }

  updateMonthOptions();
}

function onYearChange() {
  updateMonthOptions();
  renderFilteredContent();
}

function onFilterChange() {
  renderFilteredContent();
}

function updateMonthOptions() {
  const yearSel = document.getElementById("yearSelect");
  const monthSel = document.getElementById("monthSelect");
  const selectedYear = yearSel.value;
  const currentMonth = monthSel.value;
  let { yearMonthMap } = getAvailableYearsAndMonths();

  if(selectedYear === "all") {
    monthSel.innerHTML = `<option value="all">📄 すべての月</option>`;
    monthSel.value = "all";
  } else {
    monthSel.innerHTML = `<option value="all">📄 ${selectedYear}年すべての月</option>`;
    let months = yearMonthMap[selectedYear] || [];
    months.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m;
      opt.textContent = `└ ${m}月`;
      monthSel.appendChild(opt);
    });

    if([...monthSel.options].some(o => o.value === currentMonth)) {
      monthSel.value = currentMonth;
    } else {
      monthSel.value = "all";
    }
  }
}

function matchFilter(h, yearVal, monthVal) {
  if(!h.time) return false;
  let timeStr = String(h.time);
  let yM = timeStr.match(/(\d{4})年/);
  let year = yM ? yM[1] : "2026";
  let mM = timeStr.match(/(\d{1,2})月/);
  let month = mM ? mM[1] : "";

  if(yearVal !== "all" && yearVal !== year) return false;
  if(monthVal !== "all" && monthVal !== month) return false;
  return true;
}

function renderExcelChart() {
  const svg = document.getElementById("excelLineChart");
  const legendContainer = document.getElementById("chartLegend");
  const comboSelect = document.getElementById("combinationSelect");
  const yearSelect = document.getElementById("yearSelect");
  const monthSelect = document.getElementById("monthSelect");
  
  svg.innerHTML = "";
  legendContainer.innerHTML = "";

  if(!historyData || historyData.length === 0 || comboSelect.options.length === 0) return;

  const selectedCombo = comboSelect.value;
  const selectedYear = yearSelect.value;
  const selectedMonth = monthSelect.value;

  let targetHistory = historyData.filter(h => {
    const names = h.players.map(p => p.name).sort().join(", ");
    if(names !== selectedCombo) return false;
    return matchFilter(h, selectedYear, selectedMonth);
  });

  if(targetHistory.length === 0) return;

  // 先頭を 0 スタートにし、次から各回の累計収支をプロット
  let groupSum = 0;
  let rawGroupData = targetHistory.map(h => groupSum += Number(h.profit || 0));
  const groupData = [0, ...rawGroupData];

  let allNames = [];
  targetHistory.forEach(h => {
    h.players.forEach(p => {
      if(!allNames.includes(p.name)) allNames.push(p.name);
    });
  });

  let memberSeries = {};
  allNames.forEach(name => {
    let pSum = 0;
    let rawSeries = targetHistory.map(h => {
      const p = h.players.find(x => x.name === name);
      if(p) pSum += Number(p.val || 0);
      return pSum;
    });
    memberSeries[name] = [0, ...rawSeries];
  });

  let allValues = [...groupData];
  allNames.forEach(name => allValues.push(...memberSeries[name]));

  // データ数に応じて横幅を大きく広げる（1点あたり約50px確保して見やすく）
  const totalPoints = groupData.length;
  const width = Math.max(580, totalPoints * 52);
  const height = 270;
  const paddingLeft = 58;
  const paddingRight = 55; // 最後の日付が右端で見切れないよう十分な余白を確保
  const paddingTop = 25;
  const paddingBottom = 32;

  svg.style.width = `${width}px`;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  // 0を基準にキリの良い目盛り幅（1万, 2万, 5万, 10万...）を自動計算して文字の重なりを防止
  let rawMin = Math.min(0, ...allValues);
  let rawMax = Math.max(0, ...allValues);
  let rawSpan = Math.max(rawMax - rawMin, 20000);

  // 目盛りの1ステップ幅をキリの良い金額にする
  let rawStep = rawSpan / 4;
  let stepUnit = 10000;
  if (rawStep > 100000) stepUnit = 100000;
  else if (rawStep > 50000) stepUnit = 50000;
  else if (rawStep > 20000) stepUnit = 25000;
  else if (rawStep > 10000) stepUnit = 20000;
  else if (rawStep > 5000) stepUnit = 10000;
  else stepUnit = 5000;

  // 0から上下に stepUnit 刻みで目盛りを作るため、文字同士が絶対に重ならない
  let minVal = Math.floor(rawMin / stepUnit) * stepUnit;
  let maxVal = Math.ceil(rawMax / stepUnit) * stepUnit;
  if (maxVal === minVal) maxVal += stepUnit;
  let range = maxVal - minVal;

  const getX = (i) => paddingLeft + (i / (Math.max(totalPoints - 1, 1))) * (width - paddingLeft - paddingRight);
  const getY = (val) => height - paddingBottom - ((val - minVal) / range) * (height - paddingTop - paddingBottom);

  // 左側の縦軸目盛り（必ず0が含まれ、等間隔で見やすく配置）
  for(let val = minVal; val <= maxVal + 1; val += stepUnit) {
    const y = getY(val);
    const isZero = (val === 0);
    svg.innerHTML += `<line x1="${paddingLeft}" y1="${y}" x2="${width - paddingRight}" y2="${y}" stroke="${isZero ? '#64748b' : '#e2e8f0'}" stroke-width="${isZero ? '1.8' : '1'}" ${isZero ? '' : 'stroke-dasharray="3,3"'}/>`;
    
    let labelText = "";
    if (isZero) {
      labelText = "0";
    } else if (Math.abs(val) >= 10000) {
      labelText = (val / 10000) + "万";
    } else {
      labelText = (val / 1000) + "千";
    }

    svg.innerHTML += `<text x="${paddingLeft - 10}" y="${y + 4}" fill="${isZero ? '#0f172a' : '#64748b'}" font-weight="${isZero ? '800' : '500'}" font-size="11" text-anchor="end">${labelText}</text>`;
  }

  // X軸の縦線と日付ラベル（最後の点まで確実に日付を表示）
  let xStep = 1;
  if (totalPoints > 16) xStep = 3;
  else if (totalPoints > 9) xStep = 2;

  groupData.forEach((val, i) => {
    const x = getX(i);
    svg.innerHTML += `<line x1="${x}" y1="${paddingTop}" x2="${x}" y2="${height - paddingBottom}" stroke="#f1f5f9" stroke-width="1"/>`;
    
    // 最初は空文字（開始ラベル不要）、以降は間引きつつ最後の点は必ず表示
    if (i > 0 && (i === totalPoints - 1 || i % xStep === 0)) {
      let h = targetHistory[i - 1];
      let dateStr = "";
      if (h && h.time) {
        // 「2026年11月12日」を「11/12」のようにコンパクトにして見切れを完全に防ぐ（または年付きも収まるよう調整）
        let m = h.time.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
        if (m) {
          dateStr = `${m[2]}/${m[3]}`;
        } else {
          dateStr = h.time.split(' ')[0];
        }
      } else {
        dateStr = `#${i}`;
      }
      svg.innerHTML += `<text x="${x}" y="${height - 10}" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">${dateStr}</text>`;
    }
  });

  const colors = ["#6366f1", "#0ea5e9", "#10b981", "#f59e0b", "#ec4899", "#8b5cf6"];

  const drawLineAndDots = (data, color, label) => {
    if(data.length === 0) return;
    let points = [];
    data.forEach((val, i) => points.push(`${getX(i)},${getY(val)}`));

    if(data.length > 1) {
      svg.innerHTML += `<polyline fill="none" stroke="${color}" stroke-width="3" points="${points.join(" ")}" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    data.forEach((val, i) => {
      svg.innerHTML += `<circle cx="${getX(i)}" cy="${getY(val)}" r="4.5" fill="#fff" stroke="${color}" stroke-width="2.5"/>`;
    });

    legendContainer.innerHTML += `
      <div class="legend-item">
        <div class="legend-dot" style="background: ${color};"></div>
        <span>${label}</span>
      </div>
    `;
  };

  drawLineAndDots(groupData, "var(--accent)", "ノリ打ち全体");
  allNames.forEach((name, idx) => {
    const color = colors[(idx + 1) % colors.length];
    drawLineAndDots(memberSeries[name], color, name);
  });
}

document.getElementById("calcBtn").onclick = async function() {
  const pNodes = document.querySelectorAll(".player");
  if(pNodes.length === 0) {
    alert("参加者を1人以上追加してください");
    return;
  }

  let players = [];
  let hasError = false;

  pNodes.forEach(node => {
    const name = node.querySelector(".name-select").value;
    const investStr = node.querySelector(".invest").value;
    const cashStr = node.querySelector(".cash").value;
    const invest = investStr === "" ? 0 : +investStr;
    const cash = cashStr === "" ? 0 : +cashStr;

    if(!name) hasError = true;
    players.push({ name, invest, cash, node });
  });

  if(hasError) {
    alert("名前が未選択の参加者がいます。");
    return;
  }

  const totalInvest = players.reduce((s, p) => s + p.invest, 0);
  const totalCash = players.reduce((s, p) => s + p.cash, 0);
  const totalProfit = totalCash - totalInvest;
  const fairProfitPerPerson = totalProfit / players.length;

  document.getElementById("resultCard").style.display = "block";
  document.getElementById("lineSendBtn").style.display = "block";
  document.getElementById("profitTotal").textContent = money(totalProfit);
  document.getElementById("perProfit").textContent = money(fairProfitPerPerson);
  document.getElementById("investTotal").textContent = new Intl.NumberFormat("ja-JP").format(totalInvest) + "円";
  document.getElementById("cashTotal").textContent = new Intl.NumberFormat("ja-JP").format(totalCash) + "円";
  
  const tbody = document.getElementById("tbody"); tbody.innerHTML = "";
  const payList = document.getElementById("payList"); payList.innerHTML = "";
  let receive = [], pay = [], snapshot = [];

  players.forEach(p => {
    const individualProfit = p.cash - p.invest;
    const targetAmount = p.invest + fairProfitPerPerson;
    const diff = p.cash - targetAmount; 

    const resVal = p.node.querySelector(".result-value");
    resVal.textContent = money(individualProfit);
    resVal.style.color = individualProfit >= 0 ? "var(--green)" : "var(--red)";

    if(diff > 1) {
      pay.push({ name: p.name, amount: diff });
    } else if(diff < -1) {
      receive.push({ name: p.name, amount: -diff });
    }

    const isPay = diff > 0;
    const absDiff = Math.abs(diff);
    
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><b>${p.name}</b></td><td>${new Intl.NumberFormat("ja-JP").format(p.invest)}円</td><td>${new Intl.NumberFormat("ja-JP").format(p.cash)}円</td><td style="color:${individualProfit>=0?'var(--green)':'var(--red)'}; font-weight:600;">${money(individualProfit)}</td><td style="font-weight:800; color:${isPay?'var(--red)':'var(--green)'}">${isPay ? '払う：' : '貰う：'}${new Intl.NumberFormat("ja-JP").format(Math.round(absDiff))}円</td>`;
    tbody.appendChild(tr);
    snapshot.push({ name: p.name, val: individualProfit });
  });

  let msg = `【ノリ打ち精算レポート】\n\n■ 今回の収支\n`;
  snapshot.forEach(p => msg += `・${p.name}：${money(p.val)}\n`);
  msg += `合計：${money(totalProfit)}\n\n■ 受け渡し指示\n`;
  let hasPay = false;

  pay.forEach(p => {
    receive.forEach(r => {
      if(p.amount <= 0 || r.amount <= 0) return;
      const move = Math.min(p.amount, r.amount);
      payList.innerHTML += `<div class="pay-row"><span><b>${p.name}</b> → ${r.name}</span><span style="color:var(--green);font-weight:800;">${new Intl.NumberFormat("ja-JP").format(Math.round(move))}円</span></div>`;
      msg += `・${p.name} → ${r.name}：${new Intl.NumberFormat("ja-JP").format(Math.round(move))}円\n`;
      p.amount -= move; r.amount -= move; hasPay = true;
    });
  });

  if(!hasPay) {
    payList.innerHTML = `<div style="padding:4px; color:var(--muted); font-size:13px;">受け渡しの必要はありません</div>`;
    msg += "移動なし\n";
  }
  lastShareMessage = msg;

  const dateInputVal = document.getElementById("recordDateInput").value;
  let formattedDateStr = "";
  if (dateInputVal) {
    let parts = dateInputVal.split("-");
    formattedDateStr = `${parts[0]}年${Number(parts[1])}月${Number(parts[2])}日`;
  } else {
    let now = new Date();
    formattedDateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
  }

  const newHist = {
    time: formattedDateStr, 
    profit: totalProfit, 
    players: snapshot 
  };

  document.getElementById("loading").style.display = "block";
  
  try {
    await fetch(GAS_URL, { 
      method: "POST", 
      mode: "no-cors", 
      body: JSON.stringify(newHist) 
    });
  } catch (e) {
    console.error(e);
  }

  await loadHistory();
  document.getElementById("loading").style.display = "none";
};
